<header class="app-header">
  <!-- Main Navigation Bar -->
  <div class="nav-container">
    <div class="brand">
      <a routerLink="/inicio" class="brand-link">
        <div class="brand-crest">
          <img src="images/logo.png" alt="Logo Oficial Liga de Fútbol Mujeres Diversas México" class="brand-logo-img"/>
        </div>
        <div class="brand-names">
          <span class="title">LIGA DE FÚTBOL</span>
          <span class="subtitle">MUJERES DIVERSAS MÉXICO</span>
        </div>
      </a>
    </div>

    <!-- Desktop Navigation Links -->
    <nav class="desktop-nav" aria-label="Navegación de escritorio">
      <ul class="nav-list">
        <li *ngFor="let item of navLinks">
          <a [routerLink]="item.path" routerLinkActive="active" #rla="routerLinkActive" class="nav-link">
            <!-- Icono de balón animado al estar activo -->
            <span class="active-ball" *ngIf="rla.isActive" aria-hidden="true">
              <svg viewBox="0 0 24 24" class="ball-svg" fill="none">
                <circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#2C2623" stroke-width="1.5"/>
                <polygon points="12,8 14.8,10 13.8,13.5 10.2,13.5 9.2,10" fill="#C5A059" stroke="#2C2623" stroke-width="0.8"/>
                <line x1="12" y1="8" x2="12" y2="3.2" stroke="#2C2623" stroke-width="1.2"/>
                <line x1="14.8" y1="10" x2="19.2" y2="8" stroke="#2C2623" stroke-width="1.2"/>
                <line x1="13.8" y1="13.5" x2="17.5" y2="17.5" stroke="#2C2623" stroke-width="1.2"/>
                <line x1="10.2" y1="13.5" x2="6.5" y2="17.5" stroke="#2C2623" stroke-width="1.2"/>
                <line x1="9.2" y1="10" x2="4.8" y2="8" stroke="#2C2623" stroke-width="1.2"/>
              </svg>
            </span>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <!-- Botón blanco con estilo limpio -->
      <a routerLink="/comunidad" class="btn-primary-header">
        <span>¡Quiero Jugar!</span>
      </a>
    </div>
  </div>
</header>
